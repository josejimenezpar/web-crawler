[project]
name = "crawler"
version = "0.1.0"
description = "Web crawler for IRA accessibility page sampling"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
crawler = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
